<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0B1220">
  <title>Offline | StackForge</title>
  <style>
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#0b1220;color:#edf1f7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(520px,100%);padding:32px;border:1px solid #243252;border-radius:16px;background:#111b2e;box-shadow:0 24px 70px rgba(0,0,0,.4)}.mark{display:grid;place-items:center;width:48px;height:48px;border-radius:12px;background:#2fcfc0;color:#071018;font-weight:900}.eyebrow{margin:22px 0 7px;color:#2fcfc0;font-size:.75rem;font-weight:800;letter-spacing:.12em}.card h1{margin:0 0 12px;font-size:1.8rem}.card p{color:#aeb8ca;line-height:1.65}.card button{min-height:44px;margin-top:8px;padding:0 18px;border:0;border-radius:9px;background:#f2a93b;color:#1b1204;font:700 1rem system-ui;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">SF</div>
    <p class="eyebrow">CONNECTION STATUS</p>
    <h1>You are currently offline.</h1>
    <p>Some lessons and previously cached resources may still be available. Reconnect to the internet to access online services.</p>
    <button id="retryConnection" type="button">Retry Connection</button>
  </main>
  <script src="assets/js/offline.js"></script>
</body>
</html>
